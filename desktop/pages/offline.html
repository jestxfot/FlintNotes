<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>FlintNotes</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --text: #2b2b2b; --muted: #777; --border: #d8d8d8; --accent: #7b5cff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262626; --text: #dadada; --muted: #999; --border: #444; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  .drag { height: 40px; -webkit-app-region: drag; }
  main { max-width: 520px; margin: 8vh auto 0; padding: 0 24px; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .address { color: var(--text); font-weight: 600; word-break: break-all; }
  .buttons { display: flex; gap: 8px; margin-top: 18px; }
  button { padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <h1>Нет связи с сервером</h1>
  <p class="address" id="origin"></p>
  <p id="reason"></p>
  <p id="wait"></p>
  <div class="buttons">
    <button class="primary" id="retry">Повторить сейчас</button>
    <button id="change">Другой сервер…</button>
  </div>
</main>
<script>
  const text = (id, value) => (document.getElementById(id).textContent = value)
  let next = 0
  window.flintShell.state().then((state) => {
    text('origin', state.origin || '')
    text('reason', state.message || '')
    next = state.nextRetryAt || 0
  })
  // The next try comes by itself: the app asks again, a little later each time, and goes to the notes when the server is back.
  setInterval(() => {
    const left = Math.max(0, Math.round((next - Date.now()) / 1000))
    text('wait', next ? (left ? `Следующая попытка через ${left} с` : 'Подключаюсь…') : '')
  }, 250)
  window.flintShell.onStatus((state) => {
    text('reason', state.message || '')
    next = state.nextRetryAt || 0
  })
  document.getElementById('retry').onclick = () => window.flintShell.retry()
  document.getElementById('change').onclick = () => window.flintShell.change()
</script>
</body>
</html>
