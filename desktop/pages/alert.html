<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data: https:">
<title>FlintNotes — напоминания</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --bg-hover: #e9e9e9; --text: #222; --text-muted: #5c5c5c; --text-faint: #a0a0a0; --border: #d8d8d8; --accent: #7852ee; --accent-text: #fff; --radius-m: 8px; --radius-xl: 16px; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262626; --bg-hover: #333; --text: #dadada; --text-muted: #aaa; --text-faint: #777; --border: #444; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow-y: auto; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; user-select: none; }
  body { border: 1px solid var(--border); border-radius: var(--radius-xl); }
  #card { padding: 14px 18px 18px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--text-muted); font-size: 12px; font-weight: 500; }
  header .bell { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg-hover); }
  header svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item { padding: 14px 0; }
  .item + .item { border-top: 1px solid var(--border); }
  .text { font-size: 17px; font-weight: 600; word-break: break-word; }
  .text a { color: var(--accent); text-decoration: underline; cursor: default; }
  /* Icons in a task's text (links to objects, emoji pictures) are drawn by the notes page's own style; here is the same, a character wide. */
  .icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 1em; height: 1em; line-height: 1; vertical-align: -0.125em; }
  .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon img { width: 100%; height: 100%; object-fit: contain; }
  .icon.emoji { font-size: 0.9em; }
  .inline-link-icon { display: inline-flex; margin-right: 0.25em; vertical-align: -0.12em; }
  .text img, .text svg { max-width: 1.4em; max-height: 1.4em; }
  .when { margin-top: 4px; color: var(--text-muted); font-size: 12px; }
  .status { margin-top: 6px; }
  .task-chip.days { display: inline-block; padding: 1px 9px; border-radius: 2em; background: var(--bg-hover); color: var(--text-muted); font-size: 12px; }
  .task-chip.days.soon { color: #c98a00; background: rgba(230, 160, 0, 0.16); }
  .task-chip.days.overdue { color: #e5484d; background: rgba(229, 72, 77, 0.16); }
  .actions .slide { flex: 1 1 170px; min-width: 150px; }
  .actions, .choices, .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  button { padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-m); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: var(--bg-hover); }
  button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.08); }
  .choices button { padding: 4px 11px; font-size: 12.5px; }
  .confirm { flex-direction: column; align-items: stretch; }
  .confirm .ask { font-size: 12.5px; }
  .confirm .row { display: flex; gap: 8px; align-items: center; }
  footer { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--border); }
  /* Slide to confirm: a handle dragged across the track; let go early and it goes back. */
  .slide { --slide: 0; position: relative; flex: 1; height: 38px; border: 1px solid var(--border); border-radius: 2em; background: var(--bg-hover); overflow: hidden; touch-action: none; }
  .slide .fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--slide) * 100%); background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .slide .label { position: absolute; inset: 0; display: grid; place-items: center; padding-left: 36px; color: var(--text-muted); font-size: 12.5px; pointer-events: none; }
  .slide .handle { position: absolute; top: 2px; left: calc(2px + var(--slide) * (100% - 38px)); width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; cursor: grab; outline-offset: 2px; }
  .slide.back .handle, .slide.back .fill { transition: all 0.2s ease-out; }
</style>
</head>
<body>
<div id="card">
  <header><span class="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 8.5h-17C3.5 16 6 15 6 9z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg></span><span id="title"></span></header>
  <div id="list"></div>
  <footer id="footer" hidden></footer>
</div>
<script src="alert.js"></script>
</body>
</html>
