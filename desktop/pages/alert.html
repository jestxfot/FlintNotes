<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data: https:">
<title>FlintNotes — напоминания</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --bg-hover: #e9e9e9; --text: #222; --text-muted: #5c5c5c; --text-faint: #a0a0a0; --border: #d8d8d8; --accent: #7852ee; --accent-text: #fff; --ok: #2fa56b; --warn: #d9a000; --bad: #e5484d; --radius-m: 8px; --radius-xl: 16px; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262626; --bg-hover: #333; --text: #dadada; --text-muted: #aaa; --text-faint: #777; --border: #444; } }
  * { box-sizing: border-box; }
  /* The window itself is see-through, so the card's rounded corners are real corners and not a square of the same colour. */
  html { height: 100%; overflow: hidden; background: transparent; }
  body { margin: 0; height: 100%; overflow-y: auto; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; user-select: none; border: 1px solid var(--border); border-radius: var(--radius-xl); }
  body::-webkit-scrollbar { width: 8px; }
  body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; border: 2px solid var(--bg); }
  #card { padding: 10px; animation: card-in 0.22s ease-out; }
  @keyframes card-in { from { opacity: 0; transform: translateY(10px); } }

  header { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-size: 13px; font-weight: 600; }
  header .bell { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  header .bell svg { width: 14px; height: 14px; }
  header .count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 2em; background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 600; text-align: center; }
  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  

  /* One panel per reminder; the bar on its left says how pressing it is. */
  #list { display: flex; flex-direction: column; gap: 6px; }
  .item { --tone: var(--accent); position: relative; padding: 9px 12px 10px 16px; border: 1px solid var(--border); border-radius: 12px; background: color-mix(in srgb, var(--text) 4%, transparent); overflow: hidden; }
  .item::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--tone); }
  .item.overdue { --tone: var(--bad); }
  .item.soon { --tone: var(--warn); }
  .text { font-size: 15px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .text a { color: var(--accent); text-decoration: underline; cursor: default; }
  /* Icons in a task's text (links to objects, emoji pictures) are drawn by the notes page's own style; here is the same, a character wide. */
  .icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 1em; height: 1em; line-height: 1; vertical-align: -0.125em; }
  .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon img { width: 100%; height: 100%; object-fit: contain; }
  .icon.emoji { font-size: 0.9em; }
  .inline-link-icon { display: inline-flex; margin-right: 0.25em; vertical-align: -0.12em; }
  .text img, .text svg { max-width: 1.4em; max-height: 1.4em; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; margin-top: 4px; color: var(--text-muted); font-size: 12px; }
  .meta .when { display: inline-flex; align-items: center; gap: 5px; }
  .meta .source { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 1px 8px 1px 6px; border: 0; border-radius: 2em; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 12px; }
  .meta .source:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  .meta .source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-chip.days { display: inline-block; padding: 0 8px; border-radius: 2em; background: var(--bg-hover); color: var(--text-muted); font-size: 11.5px; font-weight: 500; }
  .task-chip.days.soon { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .task-chip.days.overdue { color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, transparent); }

  .actions, .choices, .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .actions { flex-wrap: nowrap; }
  .actions .slide { flex: 1 1 auto; min-width: 150px; }
  button { padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-m); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: var(--bg-hover); }
  button:focus-visible, .slide:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.later { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 2em; color: var(--text-muted); font-size: 13px; }
  button.later svg.i { transition: transform 0.15s; }
  button.later[aria-expanded='true'] { background: var(--bg-hover); color: var(--text); }
  button.later[aria-expanded='true'] svg.i:last-child { transform: rotate(180deg); }
  .choices { margin-top: 8px; }
  .choices button { padding: 3px 11px; border-radius: 2em; font-size: 12.5px; background: var(--bg); }
  .choices button:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .confirm { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .confirm .ask { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 12.5px; font-weight: 500; }
  .confirm .ask svg.i { color: var(--warn); }
  .confirm .row { display: flex; gap: 8px; align-items: center; }
  .confirm .row button { height: 34px; border-radius: 2em; }
  footer { margin-top: 6px; }
  footer > button { width: 100%; height: 32px; padding: 0; border-radius: 10px; color: var(--text-muted); font-size: 12.5px; }

  /* Slide to confirm: a handle dragged across the track; let go early and it goes back. */
  .slide { --slide: 0; --tone: var(--accent); position: relative; flex: 1; height: 34px; border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--border)); border-radius: 2em; background: color-mix(in srgb, var(--tone) 8%, var(--bg)); overflow: hidden; touch-action: none; }
  .slide.ok { --tone: var(--ok); }
  .slide.warn { --tone: var(--warn); }
  .slide .fill { position: absolute; inset: 0 auto 0 0; width: calc(32px + var(--slide) * (100% - 32px)); border-radius: 2em; background: color-mix(in srgb, var(--tone) 38%, transparent); }
  .slide .label { position: absolute; inset: 0; display: grid; place-items: center; padding-left: 30px; white-space: nowrap; font-size: 12.5px; font-weight: 500; pointer-events: none; opacity: calc(1 - var(--slide) * 1.6); color: transparent; background: linear-gradient(100deg, var(--text-muted) 40%, var(--text) 50%, var(--text-muted) 60%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; animation: shine 3.2s linear infinite; }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  .slide .handle { position: absolute; top: 2px; left: calc(2px + var(--slide) * (100% - 32px)); width: 28px; height: 28px; border-radius: 50%; background: var(--tone); color: #fff; display: grid; place-items: center; cursor: grab; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
  .slide .handle:active { cursor: grabbing; }
  .slide .handle svg.i { width: 16px; height: 16px; stroke-width: 2.4; }
  .slide .handle .check, .slide.full .handle .chev { display: none; }
  .slide.full .handle .check { display: block; }
  .slide.back .handle, .slide.back .fill { transition: all 0.2s ease-out; }
  @media (prefers-reduced-motion: reduce) { #card, .slide .label { animation: none; } }
</style>
</head>
<body>
<div id="card">
  <header><span class="bell"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 8.5h-17C3.5 16 6 15 6 9z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg></span><span id="title"></span><span class="count" id="count" hidden></span></header>
  <div id="list"></div>
  <footer id="footer" hidden></footer>
</div>
<script src="alert.js"></script>
</body>
</html>
